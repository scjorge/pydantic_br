version: 2

mkdocs:
  configuration: mkdocs.yml

build:
  os: "ubuntu-22.04"

  tools:
    python: "3.10"

  jobs:
    post_install:
      - pip install poetry
      - poetry self add poetry-plugin-export
      - poetry config virtualenvs.create false
      - poetry export --only doc --format requirements.txt --output requirements.txt
      - pip install -r requirements.txt